  road_p0:
  - 60.0
  - 0.0
  road_p1:
  - 60.0
  - 40.0
  robot_l: -3.5
  fence_gap: 1.8
  fence_opening: 7.0
  cross_s: 20.0
  start_s: 6.0
  hide_depth: 1.0
  bus_length: 11.0
  bus_width: 2.5
  appearance_distances:
  - 1.0
  - 2.0
  - 3.0
  - 4.0
  - 6.0
  ped_speeds:
  - 1.5
  - 3.0
  - 5.0
  timeout: 40.0
