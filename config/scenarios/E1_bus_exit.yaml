# E1 / B1: 버스 차고지 출구에서 버스가 담장 틈으로 진출해 길가(진로)를 가로지름
# 구역 B: 도로 중심 x=60, 서쪽 차고지 (가상 시가지)
world: nanomob_town
robot_name: nanomob
seed: 1
repeats: 2
output: results/E1_bus_exit.csv
robot:
  length: 1.1
  width: 0.9
  speed: 1.67
profiles:
